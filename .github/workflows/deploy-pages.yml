name: Deploy Knowledge Tree to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare site content
        run: |
          mkdir -p _site
          cp knowledge_tree.html _site/index.html
          cp README.md _site/README.md
          cp docs/frontier-data.json _site/frontier-data.json 2>/dev/null || true
          cp docs/ai-knowledge-updates.json _site/ai-knowledge-updates.json 2>/dev/null || true
          # Add meta redirect for backward compat
          cat > _site/knowledge_tree.html << 'REDIRECT'
          <!DOCTYPE html>
          <html><head>
          <meta http-equiv="refresh" content="0;url=index.html">
          </head><body>
          <p>Redirecting to <a href="index.html">knowledge tree</a>...</p>
          </body></html>
          REDIRECT

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
